name: CI / Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El Dockerfile ejecuta `npm run build`, así que un PR ya valida que compila.
      - name: Build (and push if main)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs: solo amd64 y sin publicar. main: amd64 + arm64 y publica.
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: |
            ghcr.io/ronambulo/homepage:latest
            ghcr.io/ronambulo/homepage:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/ronambulo/homepage:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/ronambulo/homepage:buildcache,mode=max' || '' }}
