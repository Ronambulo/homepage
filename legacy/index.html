<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: rgba(255,255,255,.94);
    --dim: rgba(255,255,255,.62);
    --faint: rgba(255,255,255,.55);
    --line: rgba(255,255,255,.14);
    --accent: #a7dcb8;
    --neg: #e6a0a0;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0a0b url(bg.webp) center bottom / cover no-repeat fixed;
    color: var(--fg);
    font: 300 15px/1.4 "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--dim); text-decoration: none; transition: color .2s; }
  a:hover, button:hover { color: #fff; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  .tint { position: fixed; inset: 0; mix-blend-mode: color; pointer-events: none; transition: background .4s; }
  .veil { position: fixed; left: 0; right: 0; bottom: 0; height: 55vh; pointer-events: none;
          background: linear-gradient(to bottom, rgba(6,6,7,0), rgba(6,6,7,.7) 55%, rgba(6,6,7,.84)); }

  .page { position: relative; min-height: 100vh; display: flex; flex-direction: column; padding: 40px clamp(24px, 6.7vw, 96px) 40px; }
  .label { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }

  /* barra superior */
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .top button { letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-size: 12px; }

  /* reloj */
  .clock { margin-top: clamp(32px, 8vh, 72px); text-align: center; }
  #time { font-size: clamp(88px, 12.2vw, 176px); line-height: 1; font-weight: 200; letter-spacing: -.045em; }
  #date { margin-top: 16px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }

  /* buscador */
  .search { position: relative; margin: 44px auto 0; width: min(520px, 100%); }
  .search input {
    width: 100%; height: 48px; padding: 0 46px 0 22px; border-radius: 24px; outline: none;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); color: var(--fg); font: inherit; font-size: 14px;
    transition: border-color .2s, background .2s;
  }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.08); }
  .search kbd { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--faint); pointer-events: none; }

  /* módulos */
  .mods { margin-top: auto; padding-top: 28px; border-top: 1px solid var(--line); display: grid; gap: 32px 56px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 900px) { .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mod { display: block; min-width: 0; }
  .mod .big { margin-top: 14px; font-size: 44px; line-height: 1; font-weight: 200; letter-spacing: -.03em; }
  .mod .sub { margin-top: 12px; font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mod .sub.mono { font-size: 12px; }
  .pos { color: var(--accent) !important; } .neg { color: var(--neg) !important; }
  .dots { display: inline-flex; gap: 6px; margin-right: 8px; vertical-align: 1px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.3); }
  .dots i.up { background: var(--accent); } .dots i.down { background: var(--neg); }

  /* enlaces */
  .links { margin-top: 36px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 36px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
  .foot { margin-top: 18px; display: flex; justify-content: center; gap: 24px; font-size: 11px; color: rgba(255,255,255,.35); }
  .foot button { color: inherit; }

  /* hoja modal */
  .sheet { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(6,6,7,.6); backdrop-filter: blur(6px); }
  .sheet[hidden] { display: none; }
  .panel { width: min(400px, calc(100vw - 48px)); padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: rgba(14,14,16,.92); }
  .panel h2 { font-size: 11px; font-weight: 300; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin-bottom: 18px; }
  .panel form { display: grid; gap: 10px; }
  .panel input { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; color: var(--fg); font: inherit; outline: none; }
  .panel input:focus { border-color: rgba(255,255,255,.35); }
  .btn { background: rgba(255,255,255,.12); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; text-align: center; }
  .btn:hover { background: rgba(255,255,255,.2); }
  .note { font-size: 12px; color: var(--faint); }
  .err { font-size: 12px; color: var(--neg); min-height: 1em; }
  .task { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .task .box { width: 14px; height: 14px; border: 1px solid rgba(255,255,255,.4); border-radius: 50%; flex: none; }
  .task .x { margin-left: auto; color: var(--faint); }
  .task.done span { text-decoration: line-through; color: var(--faint); }
  .task.done .box { background: rgba(255,255,255,.5); }
  .tasks { max-height: 40vh; overflow: auto; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="tint" id="tint"></div>
<div class="veil"></div>

<div class="page">
  <div class="top">
    <span id="hello">Hola</span>
    <button id="theme-btn" title="Cambiar tema">Tema · Grafito</button>
  </div>

  <div class="clock">
    <div id="time" class="num">--:--</div>
    <div id="date"></div>
  </div>

  <form class="search" id="search">
    <input id="q" type="text" placeholder="Buscar o escribir una dirección" autocomplete="off" spellcheck="false">
    <kbd class="mono">/</kbd>
  </form>

  <div class="mods">
    <a class="mod" id="m-fm" href="#">
      <div class="label">Patrimonio</div>
      <div class="big num" id="fm-big">—</div>
      <div class="sub mono" id="fm-sub">&nbsp;</div>
    </a>
    <button class="mod" id="m-svc">
      <div class="label">Servicios</div>
      <div class="big num" id="svc-big">—</div>
      <div class="sub" id="svc-sub">&nbsp;</div>
    </button>
    <button class="mod" id="m-wx">
      <div class="label">Clima</div>
      <div class="big num" id="wx-big">—</div>
      <div class="sub" id="wx-sub">&nbsp;</div>
    </button>
    <button class="mod" id="m-todo">
      <div class="label">Tareas</div>
      <div class="big num" id="todo-big">0</div>
      <div class="sub" id="todo-sub">&nbsp;</div>
    </button>
  </div>

  <nav class="links" id="links"></nav>
  <div class="foot">
    <button id="edit-links">editar enlaces</button>
    <button id="fm-logout" hidden>cerrar sesión FinanceMaster</button>
  </div>
</div>

<!-- hoja: login FinanceMaster -->
<div class="sheet" id="sh-login" hidden>
  <div class="panel">
    <h2>FinanceMaster</h2>
    <form id="fm-login">
      <input id="f-url" placeholder="URL del servidor" autocomplete="url">
      <input id="f-email" type="email" placeholder="Email" autocomplete="username">
      <input id="f-pass" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn" type="submit">Conectar</button>
      <div class="err" id="f-err"></div>
      <div class="note">Solo se guarda el token de sesión en este navegador, nunca la contraseña.</div>
    </form>
  </div>
</div>

<!-- hoja: tareas -->
<div class="sheet" id="sh-todo" hidden>
  <div class="panel">
    <h2>Tareas</h2>
    <div class="tasks" id="tasks"></div>
    <form id="todo-form"><input id="todo-in" placeholder="Añadir tarea y pulsar Enter" autocomplete="off"></form>
  </div>
</div>

<script>
/* ───────── Utilidades ───────── */
const $ = id => document.getElementById(id);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k)    { try { localStorage.removeItem(k); } catch {} },
};
const eur = (n, d = 0) => new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: d }).format(n);
const signed = (n, d = 0) => (n > 0 ? "+" : n < 0 ? "−" : "") + eur(Math.abs(n), d);
const timeout = ms => AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined;

/* ───────── Temas ───────── */
const THEMES = {
  "Grafito": { tint: "rgba(0,0,0,0)",        accent: "#a7dcb8" },
  "Bosque":  { tint: "rgba(63,107,90,.55)",  accent: "#b6e0c6" },
  "Ámbar":   { tint: "rgba(168,116,58,.55)", accent: "#f0c992" },
  "Índigo":  { tint: "rgba(74,90,154,.6)",   accent: "#b9c4f2" },
  "Malva":   { tint: "rgba(122,74,112,.55)", accent: "#e3b8d9" },
};
function applyTheme(name) {
  if (!THEMES[name]) name = "Grafito";
  $("tint").style.background = THEMES[name].tint;
  document.documentElement.style.setProperty("--accent", THEMES[name].accent);
  $("theme-btn").textContent = "Tema · " + name;
}
$("theme-btn").onclick = () => {
  const names = Object.keys(THEMES), cur = ls.get("theme", "Grafito");
  const next = names[(names.indexOf(cur) + 1) % names.length];
  ls.set("theme", next); applyTheme(next);
};
applyTheme(ls.get("theme", "Grafito"));

/* ───────── Reloj y saludo ───────── */
function tick() {
  const d = new Date(), h = d.getHours();
  $("time").textContent = d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }).replace(",", " ·");
  $("hello").textContent = h < 6 ? "Buenas noches" : h < 13 ? "Buenos días" : h < 21 ? "Buenas tardes" : "Buenas noches";
}
tick(); setInterval(tick, 10000);

/* ───────── Buscador ───────── */
$("search").onsubmit = e => {
  e.preventDefault();
  const v = $("q").value.trim(); if (!v) return;
  const looksUrl = /^(https?:\/\/|localhost|\d{1,3}(\.\d{1,3}){3})/i.test(v) || /^[^\s]+\.[a-z]{2,}(\/\S*)?$/i.test(v);
  location.href = looksUrl ? (/^https?:\/\//i.test(v) ? v : "http://" + v) : "https://www.google.com/search?q=" + encodeURIComponent(v);
};
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape") document.querySelectorAll(".sheet").forEach(s => s.hidden = true);
});
document.querySelectorAll(".sheet").forEach(s => s.addEventListener("mousedown", e => { if (e.target === s) s.hidden = true; }));

/* ───────── Enlaces y host alternativo ───────── */
const DEFAULT_LINKS = [
  { name: "OpenWebUI",     url: "http://192.168.0.24:3050/" },
  { name: "DiscoPanel",    url: "http://192.168.0.24:8080/login" },
  { name: "FinanceMaster", url: "http://192.168.0.24:8000/" },
  { name: "Immich",        url: "http://192.168.0.24:2283/photos" },
];
/* Si el host local no responde se usa el alternativo (misma máquina, otra red). */
const HOST_LOCAL = "192.168.0.24", HOST_ALT = "10.147.13.1";
let useAlt = false;
const resolveUrl = u => useAlt ? u.replace(HOST_LOCAL, HOST_ALT) : u;

async function probeHost() {
  try { await fetch("http://" + HOST_LOCAL + ":8000/", { mode: "no-cors", signal: timeout(1500), cache: "no-store" }); useAlt = false; }
  catch { useAlt = true; }
  renderLinks(); probeServices();
}
function renderLinks() {
  const links = ls.get("links", DEFAULT_LINKS);
  $("links").innerHTML = "";
  for (const l of links) {
    const a = document.createElement("a");
    a.href = resolveUrl(l.url); a.textContent = l.name;
    $("links").append(a);
  }
}
$("edit-links").onclick = () => {
  const cur = ls.get("links", DEFAULT_LINKS).map(l => `${l.name} | ${l.url}`).join("\n");
  const txt = prompt("Un enlace por línea: Nombre | URL", cur);
  if (txt === null) return;
  const links = txt.split("\n").map(s => s.split("|").map(x => x.trim())).filter(p => p[0] && p[1]).map(([name, url]) => ({ name, url }));
  ls.set("links", links); renderLinks(); probeServices();
};

/* ───────── Servicios ───────── */
async function probeServices() {
  const links = ls.get("links", DEFAULT_LINKS);
  const res = await Promise.all(links.map(async l => {
    try { await fetch(resolveUrl(l.url), { mode: "no-cors", signal: timeout(2500), cache: "no-store" }); return { name: l.name, up: true }; }
    catch { return { name: l.name, up: false }; }
  }));
  const up = res.filter(r => r.up).length, down = res.filter(r => !r.up);
  $("svc-big").textContent = `${up} / ${res.length}`;
  $("svc-sub").innerHTML = "";
  const dots = document.createElement("span"); dots.className = "dots";
  res.forEach(r => { const i = document.createElement("i"); i.className = r.up ? "up" : "down"; i.title = r.name; dots.append(i); });
  $("svc-sub").append(dots, document.createTextNode(down.length ? "sin respuesta: " + down.map(d => d.name).join(", ") : "todo en línea"));
}
$("m-svc").onclick = () => { $("svc-big").textContent = "…"; probeServices(); };

/* ───────── Clima (Open-Meteo, sin clave) ───────── */
const WX = [[0,"Despejado"],[2,"Poco nuboso"],[3,"Nublado"],[48,"Niebla"],[57,"Llovizna"],[67,"Lluvia"],[77,"Nieve"],[82,"Chubascos"],[86,"Nieve"],[99,"Tormenta"]];
const wxText = c => (WX.find(([max]) => c <= max) || [0, "—"])[1];

async function loadWeather() {
  const loc = ls.get("wx_loc", null);
  if (!loc) return renderWeather();
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code&timezone=auto`, { signal: timeout(6000) });
    const j = await r.json();
    ls.set("wx_cache", { t: Math.round(j.current.temperature_2m), c: j.current.weather_code, city: loc.name });
  } catch {}
  renderWeather();
}
function renderWeather() {
  const w = ls.get("wx_cache", null);
  if (!w) { $("wx-big").textContent = "—"; $("wx-sub").textContent = "Elegir ciudad"; return; }
  $("wx-big").textContent = w.t + "°";
  $("wx-sub").textContent = `${wxText(w.c)} · ${w.city}`;
}
async function chooseCity() {
  const name = prompt("Ciudad para el clima", (ls.get("wx_loc", null) || {}).name || "");
  if (!name) return;
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=es`, { signal: timeout(6000) });
    const g = (await r.json()).results?.[0];
    if (!g) return alert("No encuentro esa ciudad");
    ls.set("wx_loc", { lat: g.latitude, lon: g.longitude, name: g.name });
    loadWeather();
  } catch { alert("No se pudo buscar la ciudad"); }
}
$("m-wx").onclick = chooseCity;
renderWeather();

/* ───────── Tareas ───────── */
const todo = { get list() { return ls.get("todos", []); }, set list(v) { ls.set("todos", v); } };
function renderTodo() {
  const l = todo.list, pending = l.filter(t => !t.done);
  $("todo-big").textContent = pending.length;
  $("todo-sub").textContent = pending[0] ? pending[0].text : (l.length ? "Todo hecho" : "Añadir una tarea");
  $("tasks").innerHTML = "";
  l.forEach((t, i) => {
    const row = document.createElement("div"); row.className = "task" + (t.done ? " done" : "");
    const box = document.createElement("button"); box.className = "box"; box.setAttribute("aria-label", "Completar");
    const txt = document.createElement("span"); txt.textContent = t.text;
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", "Borrar");
    box.onclick = txt.onclick = () => { const c = todo.list; c[i].done = !c[i].done; todo.list = c; renderTodo(); };
    x.onclick = () => { const c = todo.list; c.splice(i, 1); todo.list = c; renderTodo(); };
    row.append(box, txt, x); $("tasks").append(row);
  });
}
$("m-todo").onclick = () => { $("sh-todo").hidden = false; $("todo-in").focus(); };
$("todo-form").onsubmit = e => {
  e.preventDefault();
  const v = $("todo-in").value.trim(); if (!v) return;
  todo.list = [...todo.list, { text: v, done: false }]; $("todo-in").value = ""; renderTodo();
};
renderTodo();

/* ───────── FinanceMaster ───────── */
const fm = {
  get url()   { return (ls.get("fm_url", "https://financemaster.rodriguezdelreal.com") || "").replace(/\/+$/, ""); },
  get token() { return ls.get("fm_token", ""); },
};
async function api(path) {
  const r = await fetch(fm.url + "/api" + path, { headers: { Authorization: "Bearer " + fm.token }, signal: timeout(8000) });
  if (r.status === 401) throw Object.assign(new Error("auth"), { auth: true });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function renderFM(d) {
  const nw = d.nw.length ? d.nw[d.nw.length - 1].net_worth : d.ov.balance;
  $("fm-big").textContent = eur(nw);
  const s = d.ov.savings_month;
  $("fm-sub").textContent = signed(s) + " este mes";
  $("fm-sub").className = "sub mono " + (s >= 0 ? "pos" : "neg");
  $("fm-logout").hidden = false;
  $("m-fm").href = fm.url; $("m-fm").onclick = null;
}
function needLogin() {
  $("fm-big").textContent = "—"; $("fm-sub").textContent = "Conectar"; $("fm-sub").className = "sub mono";
  $("fm-logout").hidden = true;
  $("m-fm").href = "#";
  $("m-fm").onclick = e => { e.preventDefault(); $("sh-login").hidden = false; $("f-url").value = fm.url; $("f-email").focus(); };
}
async function loadFM() {
  if (!fm.token) return needLogin();
  const cached = ls.get("fm_cache", null);
  if (cached) renderFM(cached);
  try {
    const [ov, nw] = await Promise.all([api("/dashboard/overview"), api("/dashboard/net-worth-history?months=12").catch(() => [])]);
    const data = { ov, nw };
    ls.set("fm_cache", data); renderFM(data);
  } catch (e) {
    if (e.auth) { ls.del("fm_token"); ls.del("fm_cache"); needLogin(); }
    else if (!cached) { $("fm-sub").textContent = "sin conexión"; $("fm-sub").className = "sub mono"; }
  }
}
$("fm-login").onsubmit = async e => {
  e.preventDefault();
  $("f-err").textContent = "";
  const url = $("f-url").value.trim().replace(/\/+$/, "");
  try {
    const r = await fetch(url + "/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("f-email").value.trim(), password: $("f-pass").value }),
      signal: timeout(8000),
    });
    if (!r.ok) throw new Error(r.status === 401 ? "Credenciales incorrectas" : "Error " + r.status);
    const { access_token } = await r.json();
    ls.set("fm_url", url); ls.set("fm_token", access_token);
    $("f-pass").value = ""; $("sh-login").hidden = true;
    loadFM();
  } catch (err) {
    $("f-err").textContent = /fetch|abort|timeout/i.test(err.message) ? "No se puede alcanzar esa URL" : err.message;
  }
};
$("fm-logout").onclick = () => { ls.del("fm_token"); ls.del("fm_cache"); needLogin(); };

/* ───────── Arranque ───────── */
renderLinks();
probeHost();
loadFM();
loadWeather();
setInterval(() => { loadFM(); loadWeather(); probeServices(); }, 5 * 60 * 1000);
</script>
</body>
</html>
